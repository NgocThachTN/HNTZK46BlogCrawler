name: Daily Hinatazaka46 Blog Crawl & Archive

on:
  schedule:
    # Run once everyday at midnight UTC (07:00 AM Indochina Time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  crawl-and-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Crawler
        run: |
          npm run crawl

      - name: Commit and Push Changes
        run: |
          # Configure Git credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the generated JSON database and downloaded member/blog images
          git add public/blogs.json public/images/
          
          # Commit only if there are actual modifications
          if git diff --staged --quiet; then
            echo "No new blog posts or images found. Skipping commit."
          else
            echo "New posts or images detected! Committing changes..."
            git commit -m "Auto-update Hinatazaka46 blog database and downloaded assets [skip ci]"
            git push origin main
          fi
