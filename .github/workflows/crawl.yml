name: Auto-Crawl Blog Database

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day (twice a day)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Crawler & Compiler
        run: npm run crawl

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are modified or new files
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Committing changes..."
            git add .
            git commit -m "chore: auto-update blog archive [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No new blog posts or images found. Skipping commit."
          fi
