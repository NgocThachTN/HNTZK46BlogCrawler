name: Auto-Crawl Blog Database

on:
  schedule:
    # Runs at minute 37 of every hour to politely fetch 50 new posts (avoiding high-load top of the hour delays)
    - cron: '37 * * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Crawler & Compiler
        run: npm run crawl

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Optimize Git transfer settings to prevent HTTP 408 timeouts on large pushes (images, database)
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          
          # Check if there are modified or new files
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected. Committing changes..."
            git add .
            git commit -m "chore: auto-update blog archive [$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y %H:%M')]"
            
            # Fetch remote changes and rebase our auto-commits on top to prevent fast-forward push rejections!
            git pull --rebase origin ${{ github.ref_name }}
            
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No new blog posts or images found. Skipping commit."
          fi
